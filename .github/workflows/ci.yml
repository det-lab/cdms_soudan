name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Kaitai Struct Compiler
        run: |
          KSC_VERSION=0.11
          curl -L -o /tmp/ksc.zip "https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/${KSC_VERSION}/kaitai-struct-compiler-${KSC_VERSION}.zip"
          unzip -q /tmp/ksc.zip -d /tmp/ksc
          KSC_DIR="/tmp/ksc/kaitai-struct-compiler-${KSC_VERSION}/bin"
          echo "${KSC_DIR}" >> "$GITHUB_PATH"
          if [ -x "${KSC_DIR}/ksc" ]; then
            echo "KSC=${KSC_DIR}/ksc" >> "$GITHUB_ENV"
          else
            echo "KSC=${KSC_DIR}/kaitai-struct-compiler" >> "$GITHUB_ENV"
          fi

      - name: Build and test
        run: make all
