name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Kaitai Struct Compiler
        run: |
          KSC_VERSION=0.11
          curl -L -o /tmp/ksc.zip "https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/${KSC_VERSION}/kaitai-struct-compiler-${KSC_VERSION}.zip"
          unzip -q /tmp/ksc.zip -d /tmp/ksc
          echo "/tmp/ksc/kaitai-struct-compiler-${KSC_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build and test
        run: make all
